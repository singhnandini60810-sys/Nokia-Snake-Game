<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game Mobile Friendly</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    h1 {
      margin: 10px 0;
    }

    .info {
      display: flex;
      gap: 20px;
      margin-bottom: 10px;
      font-size: 16px;
    }

    #gameBoard {
      width: 90vw;
      max-width: 400px;
      height: 90vw;
      max-height: 400px;
      background: black;
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      grid-template-rows: repeat(20, 1fr);
      border: 3px solid white;
      position: relative;
      touch-action: none; /* important for swipe */
    }

    .snake {
      background: lime;
      border-radius: 4px;
    }

    .food {
      background: red;
      border-radius: 50%;
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    #startBtn {
      background: lime;
      color: black;
    }

    #pauseBtn {
      background: orange;
      color: black;
    }

    #replayBtn {
      background: cyan;
      color: black;
      display: none;
    }

    /* D-pad */
    .dpad {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 8px;
    }

    .dpad button {
      font-size: 20px;
      background: #333;
      color: white;
      border-radius: 12px;
    }

    .dpad button:active {
      background: #666;
    }

    /* Game Over overlay */
    #gameOverScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 24px;
    }

    #gameOverScreen button {
      margin-top: 15px;
      background: red;
      color: white;
    }
  </style>
</head>

<body>
  <h1>🐍 Nokia Snake</h1>

  <div class="info">
    <div id="score">Score: 0</div>
    <div id="highScore">High Score: 0</div>
  </div>

  <div id="gameBoard">
    <div id="gameOverScreen">
      <div>💀 GAME OVER</div>
      <div id="finalScore" style="margin-top: 10px; font-size: 18px;"></div>
      <button onclick="replayGame()">Replay</button>
    </div>
  </div>

  <div class="buttons">
    <button id="startBtn" onclick="startGame()">Start</button>
    <button id="pauseBtn" onclick="togglePause()" disabled>Pause</button>
    <button id="replayBtn" onclick="replayGame()">Replay</button>
  </div>

  <!-- Touch D-pad -->
  <div class="dpad">
    <div></div>
    <button onclick="setDirection(0,-1)">⬆️</button>
    <div></div>

    <button onclick="setDirection(-1,0)">⬅️</button>
    <button onclick="setDirection(0,0)">⏹️</button>
    <button onclick="setDirection(1,0)">➡️</button>

    <div></div>
    <button onclick="setDirection(0,1)">⬇️</button>
    <div></div>
  </div>

  <script>
    const board = document.getElementById("gameBoard");
    const scoreText = document.getElementById("score");
    const highScoreText = document.getElementById("highScore");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const replayBtn = document.getElementById("replayBtn");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const finalScore = document.getElementById("finalScore");

    const boardSize = 20;

    let snake, food, direction, score, gameInterval;
    let isRunning = false;
    let isPaused = false;

    let highScore = localStorage.getItem("highScore") || 0;
    highScoreText.innerText = "High Score: " + highScore;

    function initGame() {
      snake = [{ x: 10, y: 10 }];
      food = { x: 5, y: 5 };
      direction = { x: 0, y: 0 };
      score = 0;
      scoreText.innerText = "Score: 0";
      generateFood();
      drawGame();
    }

    function drawGame() {
      board.innerHTML = "";
      board.appendChild(gameOverScreen);

      snake.forEach(part => {
        const snakeElement = document.createElement("div");
        snakeElement.style.gridRowStart = part.y;
        snakeElement.style.gridColumnStart = part.x;
        snakeElement.classList.add("snake");
        board.appendChild(snakeElement);
      });

      const foodElement = document.createElement("div");
      foodElement.style.gridRowStart = food.y;
      foodElement.style.gridColumnStart = food.x;
      foodElement.classList.add("food");
      board.appendChild(foodElement);
    }

    function moveSnake() {
      const head = { ...snake[0] };
      head.x += direction.x;
      head.y += direction.y;

      if (head.x < 1 || head.x > boardSize || head.y < 1 || head.y > boardSize) {
        endGame();
        return;
      }

      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          endGame();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreText.innerText = "Score: " + score;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function generateFood() {
      food.x = Math.floor(Math.random() * boardSize) + 1;
      food.y = Math.floor(Math.random() * boardSize) + 1;

      snake.forEach(part => {
        if (part.x === food.x && part.y === food.y) {
          generateFood();
        }
      });
    }

    function gameLoop() {
      if (!isRunning || isPaused) return;
      if (direction.x === 0 && direction.y === 0) return;

      moveSnake();
      drawGame();
    }

    function startGame() {
      if (isRunning) return;

      isRunning = true;
      isPaused = false;

      pauseBtn.disabled = false;
      pauseBtn.innerText = "Pause";

      startBtn.disabled = true;
      replayBtn.style.display = "inline-block";
      gameOverScreen.style.display = "none";

      gameInterval = setInterval(gameLoop, 150);
    }

    function togglePause() {
      if (!isRunning) return;
      isPaused = !isPaused;
      pauseBtn.innerText = isPaused ? "Play" : "Pause";
    }

    function endGame() {
      clearInterval(gameInterval);
      isRunning = false;
      isPaused = false;

      if (score > highScore) {
        highScore = score;
        localStorage.setItem("highScore", highScore);
        highScoreText.innerText = "High Score: " + highScore;
      }

      finalScore.innerText = "Your Score: " + score;
      gameOverScreen.style.display = "flex";

      startBtn.disabled = false;
      pauseBtn.disabled = true;
      pauseBtn.innerText = "Pause";
    }

    function replayGame() {
      clearInterval(gameInterval);
      initGame();

      isRunning = false;
      isPaused = false;

      startBtn.disabled = false;
      pauseBtn.disabled = true;
      pauseBtn.innerText = "Pause";

      gameOverScreen.style.display = "none";
    }

    function setDirection(x, y) {
      if (!isRunning) return;

      // Prevent reversing direction
      if (x === -direction.x && y === -direction.y) return;

      direction = { x, y };
    }

    // Keyboard controls
    document.addEventListener("keydown", (event) => {
      if (!isRunning) return;

      switch (event.key) {
        case "ArrowUp": setDirection(0, -1); break;
        case "ArrowDown": setDirection(0, 1); break;
        case "ArrowLeft": setDirection(-1, 0); break;
        case "ArrowRight": setDirection(1, 0); break;
      }
    });

    // Swipe controls
    let startX = 0;
    let startY = 0;

    board.addEventListener("touchstart", (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });

    board.addEventListener("touchend", (e) => {
      let endX = e.changedTouches[0].clientX;
      let endY = e.changedTouches[0].clientY;

      let diffX = endX - startX;
      let diffY = endY - startY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30) setDirection(1, 0);   // right
        else if (diffX < -30) setDirection(-1, 0); // left
      } else {
        if (diffY > 30) setDirection(0, 1);   // down
        else if (diffY < -30) setDirection(0, -1); // up
      }
    });

    initGame();
  </script>
</body>
</html>
